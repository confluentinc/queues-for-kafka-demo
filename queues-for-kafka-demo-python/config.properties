# Queues for Kafka Demo - configuration
#
# Uncomment any line below and change its value to override the default.
# Read once at process startup by qfk_demo/config.py.

# Kafka bootstrap servers
#bootstrap.servers=localhost:9092

# Where chefs and the auto-scaler report status (the dashboard's own URL)
#dashboard.url=http://localhost:8080

# Dashboard HTTP port
#port=8080

# Delay between orders after the initial burst, in milliseconds
#order.interval.ms=5000

# Simulated per-order processing time, in milliseconds (minimum enforced: 2000)
#chef.processing.delay.ms=2000

# Fraction of orders a chef accepts (the rest is split release/reject)
#chef.accept.rate=0.80

# Enable the chef auto-scaler
#auto.scale.enabled=true

# Minimum chef processes
#auto.scale.min.chefs=1

# Maximum chef processes
#auto.scale.max.chefs=4

# Queue depth per chef that triggers scale-up
#auto.scale.up.threshold=5

# Queue depth at/below which the scaler returns to the minimum
#auto.scale.down.threshold=2

# How often the autoscaler re-evaluates, in milliseconds
#auto.scale.check.interval.ms=3000

# Disable automatic scaling; use the dashboard's Add/Remove Chef buttons instead
#manual.scale.mode=false

# --- ShareConsumer (KIP-932) settings, used by the chefs ---

# Share group ID the chefs join for queue-style consumption (KIP-932 share group)
chef.group.id=chefs-share-group

# Acknowledgement mode for the chefs' ShareConsumer. 'explicit' requires each
# message to be acknowledged via accept/release/reject, which is what this
# demo's chefs do to show off KIP-932's redelivery behavior. 'implicit' would
# auto-accept every message on the next poll/commit instead.
share.acknowledgement.mode=explicit
